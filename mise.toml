[tools]
uv = "0.12.10"

[settings]
locked = true
http_retries = 5

[tasks."test:workflow"]
description = "Check SBX policy and project environment"
wait_for = ["python:test"]
run = "uv run --frozen pytest -m 'not integration' tests/integration/test_sbx_command_policy.py tests/integration/test_sbx_command_retirement.py tests/integration/test_ai_workflow_permissions.py tests/integration/test_sbx_project_environment.py"

[tasks."check:skill-metadata"]
description = "Check Codex skill display names"
wait_for = ["test:workflow"]
run = """
set -euo pipefail
scratch=$(mktemp -d "${TMPDIR:-/tmp}/skill-metadata.XXXXXXXX")
trap 'rm -rf "$scratch"' EXIT
chezmoi --source . --destination "$scratch/dest" --config "$scratch/config.toml" init --promptDefaults
chezmoi --source . --destination "$scratch/dest" --config "$scratch/config.toml" data --format json | uv run --frozen --with 'PyYAML==6.0.3' python scripts/check_skill_metadata.py --source-root src/chezmoi --host codex --config -
uv run --frozen --with 'PyYAML==6.0.3' pytest -p no:cacheprovider -m 'not integration' tests/integration/test_skill_metadata.py
"""

[tasks.verify]
description = "Run project checks"
depends = [
    "python:lint",
    "python:format",
    "python:typecheck",
    "python:test",
    "test:workflow",
    "check:skill-metadata",
    "python:build",
]

[tasks."python:sync"]
description = "Install Python dependencies"
run = "uv sync --all-packages --frozen"

[tasks."python:lint"]
description = "Lint Python packages"
depends = ["python:sync"]
run = "uv run --frozen --no-sync ruff check ."

[tasks."python:format"]
description = "Check Python formatting"
depends = ["python:sync"]
wait_for = ["python:lint"]
run = "uv run --frozen --no-sync ruff format --check ."

[tasks."python:typecheck"]
description = "Type check Python packages"
depends = ["python:sync"]
wait_for = ["python:format"]
run = "uv run --frozen --no-sync ty check"

[tasks."python:test"]
description = "Test Python packages"
depends = ["python:sync"]
wait_for = ["python:typecheck"]
run = "uv run --frozen --no-sync pytest src/python --cov --cov-report=term-missing"

[tasks."python:build"]
description = "Build Python packages"
wait_for = ["check:skill-metadata"]
run = "uv build --all-packages"
