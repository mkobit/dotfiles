name: Upgrade binary tools

on:
  schedule:
    # Run daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      tool:
        description: 'Specific tool to upgrade (e.g. agy, codex, or all)'
        required: false
        default: 'all'

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ secrets.BIN_UPDATER_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup-mise

      - name: Install dependencies
        run: uv sync --all-packages --frozen

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run upgrades and open pull requests
        env:
          GITHUB_TOKEN: ${{ secrets.BIN_UPDATER_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.BIN_UPDATER_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          target_tool="${{ github.event.inputs.tool }}"
          catalog_dir="src/chezmoi/.chezmoidata/bin"
          base_branch="${{ github.ref_name }}"

          if [ -n "$target_tool" ] && [ "$target_tool" != "all" ]; then
            tool_files=("$catalog_dir/$target_tool.toml")
          else
            tool_files=("$catalog_dir"/*.toml)
          fi

          for tool_path in "${tool_files[@]}"; do
            [ -f "$tool_path" ] || continue
            tool_name="$(basename "$tool_path" .toml)"
            echo "Checking $tool_name..."

            # Run updater for single tool with error isolation
            if ! uv run --package bin-updater bin-updater --tool "$tool_name"; then
              echo "Failed to check or upgrade $tool_name; skipping."
              git checkout -- "$tool_path"
              continue
            fi

            if git diff --quiet "$tool_path"; then
              echo "No changes for $tool_name."
              continue
            fi

            branch="automation/upgrade-$tool_name"
            if git fetch origin "$branch" 2>/dev/null; then
              if git diff --quiet "origin/$branch" -- "$tool_path"; then
                echo "Remote branch $branch already has identical changes for $tool_name; skipping."
                git checkout -- "$tool_path"
                continue
              fi
            fi

            if ! (
              set -e
              git checkout -B "$branch"
              git add "$tool_path"
              git commit -m "chore(deps): update $tool_name"
              git push origin "$branch" --force

              if ! gh pr view "$branch" >/dev/null 2>&1; then
                gh pr create \
                  --base "$base_branch" \
                  --head "$branch" \
                  --title "chore(deps): update $tool_name" \
                  --body "Automated binary tool upgrade for $tool_name."
              fi

              gh pr merge "$branch" --auto --squash || true
            ); then
              echo "Failed to publish PR for $tool_name; continuing."
            fi

            git checkout "$base_branch"
            git checkout -- "$tool_path" || true
          done
