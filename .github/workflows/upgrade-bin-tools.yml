name: Upgrade binary tools

on:
  schedule:
    # Run daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      tool:
        description: 'Specific tool to upgrade (e.g. agy, codex, or all)'
        required: false
        default: 'all'

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Create binary updater token
        if: vars.BIN_UPDATER_APP_CLIENT_ID != ''
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.BIN_UPDATER_APP_CLIENT_ID }}
          private-key: ${{ secrets.BIN_UPDATER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.BIN_UPDATER_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: $/.github/actions/setup-mise

      - name: Install dependencies
        run: uv sync --all-packages --frozen

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run upgrades and open pull requests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.BIN_UPDATER_TOKEN || secrets.GITHUB_TOKEN }}
          TARGET_TOOL: ${{ github.event.inputs.tool }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          target_tool="$TARGET_TOOL"
          catalog_dir="src/chezmoi/.chezmoidata/bin"
          base_branch="$BASE_BRANCH"
          report_dir="$(mktemp -d)"
          trap 'rm -rf "$report_dir"' EXIT
          report_file="$report_dir/report.json"
          body_file="$report_dir/body.md"

          if [[ -n "$target_tool" && "$target_tool" != "all" && ! "$target_tool" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "Invalid tool name: $target_tool" >&2
            exit 1
          fi

          if [ -n "$target_tool" ] && [ "$target_tool" != "all" ]; then
            tool_files=("$catalog_dir/$target_tool.toml")
          else
            tool_files=("$catalog_dir"/*.toml)
          fi

          for tool_path in "${tool_files[@]}"; do
            [ -f "$tool_path" ] || continue
            tool_name="$(basename "$tool_path" .toml)"
            echo "Checking $tool_name..."

            # Run updater for single tool with error isolation
            : > "$report_file"
            if ! uv run --package bin-updater bin-updater --tool "$tool_name" --report-file "$report_file"; then
              echo "Failed to check or upgrade $tool_name; skipping."
              git checkout -- "$tool_path"
              continue
            fi

            if ! jq -e 'length == 1 and .[0].changed == true' "$report_file" >/dev/null; then
              echo "No update report for $tool_name."
              continue
            fi

            if git diff --quiet "$tool_path"; then
              echo "No changes for $tool_name."
              continue
            fi

            branch="automation/upgrade-$tool_name"
            push_changes=true
            if git fetch origin "$branch" 2>/dev/null; then
              if git diff --quiet "origin/$branch" -- "$tool_path"; then
                echo "Remote branch $branch already has identical changes for $tool_name."
                push_changes=false
              fi
            fi

            if ! (
              title="$(jq -er '.[0].pr_title | select(type == "string" and length > 0)' "$report_file")" || exit 1
              jq -er '.[0].pr_body | select(type == "string" and length > 0)' "$report_file" > "$body_file" || exit 1

              if [ "$push_changes" = true ]; then
                git checkout -B "$branch" || exit 1
                git add "$tool_path" || exit 1
                git commit -m "$title" || exit 1
                git push origin "$branch" --force-with-lease || exit 1
              fi

              if [ "$(gh pr view "$branch" --json state --jq '.state' 2>/dev/null)" = OPEN ]; then
                gh pr edit "$branch" --title "$title" --body-file "$body_file" || exit 1
              else
                gh pr create \
                  --base "$base_branch" \
                  --head "$branch" \
                  --title "$title" \
                  --body-file "$body_file" || exit 1
              fi

              gh pr merge "$branch" --auto --squash || true
            ); then
              echo "Failed to publish PR for $tool_name; continuing."
            fi

            git checkout "$base_branch"
            git checkout -- "$tool_path" || true
          done
