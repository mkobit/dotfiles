name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  UV_CACHE_DIR: /tmp/.uv-cache
  UV_PYTHON_INSTALL_DIR: /tmp/.uv-python
  MISE_CACHE_DIR: /tmp/.mise-cache
  BUN_INSTALL_CACHE_DIR: /tmp/.bun-cache
  CHEZMOI_CACHE_DIR: /tmp/.chezmoi-cache
  APT_CACHE_DIR: /tmp/.apt-cache
  CHEZMOI_CONFIG: /tmp/.chezmoi-config.toml
  CHEZMOI_DEST: /tmp/chezmoi-test
  CHEZMOI_VERSION: v2.74.0

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check OpenShell Dockerfile
        timeout-minutes: 5
        run: |
          set -o pipefail
          git archive HEAD | docker build --check --file src/openshell/images/shared/Dockerfile -
      - uses: $/.github/actions/setup-mise
      - name: Restore uv cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ runner.arch }}-${{ github.head_ref || github.ref_name }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ runner.arch }}-${{ github.head_ref || github.ref_name }}-
            uv-${{ runner.os }}-${{ runner.arch }}-main-
      - name: Install dependencies
        run: uv sync --all-packages --frozen
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Type check (ty)
        run: uv run ty check
      - name: Minimize uv cache
        run: uv cache prune --ci

  skill-filter-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-mise
      - name: Restore uv Python cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.UV_PYTHON_INSTALL_DIR }}
          key: uv-python-3.8-${{ runner.os }}-${{ runner.arch }}-${{ github.head_ref || github.ref_name }}
          restore-keys: |
            uv-python-3.8-${{ runner.os }}-${{ runner.arch }}-main
      - name: Install Python 3.8
        run: uv python install 3.8
      - name: Test skill_filter on Python 3.8
        env:
          PYTHONPATH: src/python/skill_filter
          UV_PYTHON_DOWNLOADS: manual
        run: uv run --no-project --python 3.8 --with pytest -- python -m pytest -c src/python/skill_filter/pyproject.toml src/python/skill_filter/tests/ -q

  integration:
    needs: [lint]
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'ubuntu-24.04-arm' && 30 || 50 }}
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          persist-credentials: false

      - name: Prepare APT download cache
        id: apt-cache-prepare
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$APT_CACHE_DIR"
          sudo install -d -o _apt -g root -m 0700 "$APT_CACHE_DIR/partial"
          printf 'Dir::Cache::archives "%s";\nAPT::Keep-Downloaded-Packages "true";\n' "$APT_CACHE_DIR" \
            | sudo tee /etc/apt/apt.conf.d/99-ci-download-cache >/dev/null
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore APT downloads
        id: apt-cache
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.APT_CACHE_DIR }}/*.deb
          key: apt-v1-${{ matrix.os }}-${{ runner.arch }}-${{ github.head_ref || github.ref_name }}-${{ steps.apt-cache-prepare.outputs.week }}-${{ hashFiles('src/chezmoi/.chezmoidata/packages/**', 'src/chezmoi/.chezmoi.toml.tmpl') }}
          restore-keys: |
            apt-v1-${{ matrix.os }}-${{ runner.arch }}-${{ github.head_ref || github.ref_name }}-
            apt-v1-${{ matrix.os }}-${{ runner.arch }}-main-

      - name: Restore chezmoi downloads
        id: chezmoi-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.CHEZMOI_CACHE_DIR }}
          key: chezmoi-cache-v4-${{ runner.os }}-${{ runner.arch }}-${{ github.head_ref || github.ref_name }}-${{ hashFiles('src/chezmoi/.chezmoidata/**', 'src/chezmoi/.chezmoidata.toml', 'src/chezmoi/**/.chezmoiexternals/**') }}
          restore-keys: |
            chezmoi-cache-v4-${{ runner.os }}-${{ runner.arch }}-${{ github.head_ref || github.ref_name }}-
            chezmoi-cache-v4-${{ runner.os }}-${{ runner.arch }}-main-

      - name: Cache skill-filter output
        uses: actions/cache@v6.1.0
        with:
          # Apply uses the runner home; integration pytest uses CHEZMOI_DEST as HOME.
          path: |
            ~/.cache/skill-filter
            ${{ env.CHEZMOI_DEST }}/.cache/skill-filter
          key: skill-filter-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/python/skill_filter/**') }}-${{ github.head_ref || github.ref_name }}-${{ hashFiles('src/chezmoi/.chezmoidata/ai/**', 'src/chezmoi/.chezmoi.toml.tmpl', 'src/chezmoi/.chezmoiexternals/ai-*.toml.tmpl') }}
          restore-keys: |
            skill-filter-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/python/skill_filter/**') }}-${{ github.head_ref || github.ref_name }}-
            skill-filter-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/python/skill_filter/**') }}-main-

      - name: Cache mise downloads
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.MISE_CACHE_DIR }}
          key: mise-cache-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock', 'src/chezmoi/.chezmoidata/bin/mise.toml') }}
          restore-keys: |
            mise-cache-v2-${{ runner.os }}-${{ runner.arch }}-
            mise-cache-v1-${{ runner.os }}-${{ runner.arch }}-main-

      - name: Cache bun install cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: bun-cache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.head_ref || github.ref_name }}-${{ hashFiles('src/chezmoi/.chezmoidata/bin/mise.toml') }}
          restore-keys: |
            bun-cache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.head_ref || github.ref_name }}-
            bun-cache-v1-${{ runner.os }}-${{ runner.arch }}-main-

      - name: Restore uv cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ runner.arch }}-${{ github.head_ref || github.ref_name }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ runner.arch }}-${{ github.head_ref || github.ref_name }}-
            uv-${{ runner.os }}-${{ runner.arch }}-main-

      - name: Install chezmoi
        run: |
          sh -c "$(curl --retry 5 -fsLS get.chezmoi.io)" -- -b ~/.local/bin -t ${{ env.CHEZMOI_VERSION }}
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Initialize chezmoi
        run: |
          mkdir -p ${{ env.CHEZMOI_DEST }}
          chezmoi init \
            --cache=${{ env.CHEZMOI_CACHE_DIR }} \
            --source=${{ github.workspace }} \
            --destination=${{ env.CHEZMOI_DEST }} \
            --config=${{ env.CHEZMOI_CONFIG }}

      - name: Run chezmoi doctor
        run: |
          chezmoi doctor \
            --cache=${{ env.CHEZMOI_CACHE_DIR }} \
            --config=${{ env.CHEZMOI_CONFIG }} \
            --source=${{ github.workspace }} \
            --destination=${{ env.CHEZMOI_DEST }} \
            --no-network

      - name: Prefetch chezmoi externals
        id: chezmoi-prefetch
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOMAXPROCS: "1"
        run: |
          set -o pipefail
          report_dir="$RUNNER_TEMP/integration-reports"
          mkdir -p "$report_dir"
          # Render and cache target state without running installation scripts.
          # Chezmoi has no HTTP retry option; completed downloads remain cached.
          for attempt in 1 2 3 4 5; do
            chezmoi apply --dry-run --exclude=scripts --output=/dev/null --verbose=false --progress=false \
              --cache="$CHEZMOI_CACHE_DIR" \
              --config="$CHEZMOI_CONFIG" \
              --source="$GITHUB_WORKSPACE" \
              --destination="$CHEZMOI_DEST" 2>&1 | tee "$report_dir/chezmoi-prefetch-$attempt.log" && exit 0
            echo "::warning::chezmoi prefetch attempt $attempt failed"
            if [ "$attempt" -lt 5 ]; then
              sleep $((15 * 2 ** (attempt - 1)))
            fi
          done
          exit 1

      - name: Run chezmoi apply
        id: chezmoi-apply
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOMAXPROCS: "1"
          CHEZMOI_APT_REPORT_DIR: ${{ runner.temp }}/integration-reports/apt
        run: |
          set -o pipefail
          report_dir="$RUNNER_TEMP/integration-reports"
          mkdir -p "$report_dir"
          apply_started_at=$SECONDS
          printf '%s chezmoi apply started\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if chezmoi apply \
            --cache="$CHEZMOI_CACHE_DIR" \
            --config="$CHEZMOI_CONFIG" \
            --source="$GITHUB_WORKSPACE" \
            --destination="$CHEZMOI_DEST" 2>&1 | tee "$report_dir/chezmoi-apply.log"; then
            apply_result=0
          else
            apply_result=$?
          fi
          printf '%s chezmoi apply finished elapsed_seconds=%s result=%s\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$((SECONDS - apply_started_at))" "$apply_result"
          exit "$apply_result"

      - name: Check SBX version
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            "$CHEZMOI_DEST/.local/bin/sbx" --version
          else
            "$(brew --prefix)/bin/sbx" --version
          fi

      # Use unique keys after failed applies so later runs can save more packages.
      - name: Save APT downloads
        if: ${{ always() && runner.os == 'Linux' && steps.apt-cache.outputs.cache-primary-key != '' && steps.apt-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.APT_CACHE_DIR }}/*.deb
          key: ${{ steps.chezmoi-apply.outcome == 'success' && steps.apt-cache.outputs.cache-primary-key || format('{0}-{1}-{2}', steps.apt-cache.outputs.cache-primary-key, github.run_id, github.run_attempt) }}

      # Save completed downloads even if apply fails or later integration steps fail.
      # Only failed applies use unique keys, so complete caches do not grow on every run.
      - name: Save chezmoi downloads
        if: ${{ !cancelled() && (steps.chezmoi-prefetch.outcome == 'failure' || steps.chezmoi-apply.outcome == 'success' || steps.chezmoi-apply.outcome == 'failure') && steps.chezmoi-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.CHEZMOI_CACHE_DIR }}
          key: ${{ steps.chezmoi-apply.outcome == 'success' && steps.chezmoi-cache.outputs.cache-primary-key || format('{0}-{1}-{2}', steps.chezmoi-cache.outputs.cache-primary-key, github.run_id, github.run_attempt) }}

      - name: Prune mise cache
        run: |
          MISE_BIN_DIR=$(chezmoi \
            --config=${{ env.CHEZMOI_CONFIG }} \
            --source=${{ github.workspace }} \
            --destination=${{ env.CHEZMOI_DEST }} \
            target-path ${{ github.workspace }}/src/chezmoi/dot_local/bin)
          echo "$MISE_BIN_DIR" >> $GITHUB_PATH
          "$MISE_BIN_DIR/mise" cache prune --yes

      # Use the mise binary installed by chezmoi apply and load tools from the test HOME.
      - name: Install python dependencies for integration tests
        env:
          HOME: ${{ env.CHEZMOI_DEST }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mise exec -- uv sync --all-packages --frozen

      - name: Run system integration tests
        env:
          HOME: ${{ env.CHEZMOI_DEST }}
          GITHUB_TOKEN: ${{ github.token }}
          INTEGRATION_SUMMARY_RUNNER: ${{ matrix.os }}
        run: |
          set -o pipefail
          report_dir="$RUNNER_TEMP/integration-reports"
          mkdir -p "$report_dir"
          mise exec -- uv run --frozen pytest tests/integration -ra --durations=20 \
            --junitxml="$report_dir/pytest.xml" 2>&1 | tee "$report_dir/pytest.log"

      # Reuse the runner and report Python failures even if integration failed.
      # The CI setup action adds mise shims to PATH so the Python steps can call uv directly.
      - name: Set up mise for Python tests
        id: python-test-setup
        if: ${{ !cancelled() && matrix.os != 'ubuntu-24.04-arm' && steps.checkout.outcome == 'success' }}
        uses: $/.github/actions/setup-mise

      - name: Test and build Python packages
        if: ${{ !cancelled() && steps.python-test-setup.outcome == 'success' }}
        timeout-minutes: 20
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/python-test-venv
        run: |
          uv sync --all-packages --frozen
          report_dir="$RUNNER_TEMP/integration-reports"
          mkdir -p "$report_dir"
          uv run --frozen pytest src/python --cov --cov-report=term-missing \
            --junitxml="$report_dir/python.xml"
          uv build --all-packages
          uv cache prune --ci

      - name: Publish test results and durations
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6.7.0
        with:
          report_paths: ${{ runner.temp }}/integration-reports/*.xml
          skip_annotations: true
          detailed_summary: true
          failed_summary_logs: true
          include_passed: true
          include_time_in_summary: true

      - name: Upload integration reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: integration-reports-${{ matrix.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/integration-reports/
          retention-days: 7
          if-no-files-found: ignore
