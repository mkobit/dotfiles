name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  UV_CACHE_DIR: /tmp/.uv-cache
  UV_PYTHON_INSTALL_DIR: /tmp/.uv-python
  MISE_CACHE_DIR: /tmp/.mise-cache
  CHEZMOI_CACHE_DIR: /tmp/.chezmoi-cache
  APT_CACHE_DIR: /tmp/.apt-cache
  CHEZMOI_CONFIG: /tmp/.chezmoi-config.toml
  CHEZMOI_DEST: /tmp/chezmoi-test

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-mise
      - name: Check OpenShell Dockerfile
        timeout-minutes: 5
        run: mise run openshell:check
      - name: Restore uv cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies
        run: mise run python:sync
      - name: Lint (ruff)
        run: mise run python:lint
      - name: Format check (ruff)
        run: mise run python:format
      - name: Type check (ty)
        run: mise run python:typecheck
      - name: Minimize uv cache
        run: uv cache prune --ci

  skill-filter-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-mise
      - name: Restore uv Python cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.UV_PYTHON_INSTALL_DIR }}
          key: uv-python-3.8-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            uv-python-3.8-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Python 3.8
        run: uv python install 3.8
      - name: Test skill_filter on Python 3.8
        run: mise run python:test-skill-filter-compat

  integration:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'ubuntu-24.04-arm' && 30 || 50 }}
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          persist-credentials: false

      - name: Prepare APT download cache
        id: apt-cache-prepare
        if: runner.os == 'Linux'
        run: .github/scripts/prepare-apt-cache.sh

      - name: Restore APT downloads
        id: apt-cache
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.APT_CACHE_DIR }}/*.deb
          key: apt-v1-${{ matrix.os }}-${{ runner.arch }}-${{ steps.apt-cache-prepare.outputs.week }}-${{ hashFiles('src/chezmoi/.chezmoidata/packages/**', 'src/chezmoi/.chezmoi.toml.tmpl') }}
          restore-keys: |
            apt-v1-${{ matrix.os }}-${{ runner.arch }}-

      - name: Restore chezmoi downloads
        id: chezmoi-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.CHEZMOI_CACHE_DIR }}
          key: chezmoi-cache-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/chezmoi/.chezmoidata/bin/**', 'src/chezmoi/.chezmoidata/ai/agents.toml', 'src/chezmoi/.chezmoidata/ai/plugins/**', 'src/chezmoi/.chezmoidata/ai/plugin-bridge.toml', 'src/chezmoi/.chezmoidata/ai/skills/**', 'src/chezmoi/.chezmoidata/fonts/**', 'src/chezmoi/.chezmoidata/tmux/plugins/**', 'src/chezmoi/.chezmoidata/zellij/plugins/**', 'src/chezmoi/.chezmoidata/fzf_plugins_data.toml', 'src/chezmoi/.chezmoidata/github_releases.toml', 'src/chezmoi/.chezmoidata.toml', 'src/chezmoi/.chezmoi.toml.tmpl', 'src/chezmoi/**/.chezmoiexternals/**') }}
          restore-keys: |
            chezmoi-cache-v4-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache skill-filter output
        uses: actions/cache@v6.1.0
        with:
          # Apply uses the runner home; integration pytest uses CHEZMOI_DEST as HOME.
          path: |
            ~/.cache/skill-filter
            ${{ env.CHEZMOI_DEST }}/.cache/skill-filter
          key: skill-filter-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/python/skill_filter/**') }}-${{ hashFiles('src/chezmoi/.chezmoidata/ai/**', 'src/chezmoi/.chezmoi.toml.tmpl', 'src/chezmoi/.chezmoiexternals/ai-*.toml.tmpl') }}
          restore-keys: |
            skill-filter-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/python/skill_filter/**') }}-
            skill-filter-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache mise downloads
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.MISE_CACHE_DIR }}
          key: mise-cache-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock', 'src/chezmoi/.chezmoidata/bin/mise.toml') }}
          restore-keys: |
            mise-cache-v2-${{ runner.os }}-${{ runner.arch }}-
            mise-cache-v1-${{ runner.os }}-${{ runner.arch }}-main-

      - name: Restore uv cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Homebrew downloads
        if: runner.os == 'macOS'
        uses: actions/cache@v6.1.0
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-${{ runner.arch }}-homebrew-v1-${{ hashFiles('src/chezmoi/.chezmoitemplates/brewfile', 'src/chezmoi/.chezmoiscripts/run_once_install-tmux.sh.tmpl', 'src/chezmoi/.chezmoiscripts/run_onchange_after_install-brew-packages.sh.tmpl') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-homebrew-v1-

      - uses: $/.github/actions/setup-chezmoi

      - name: Initialize chezmoi
        run: .github/scripts/ci-chezmoi-apply.sh init

      - name: Run chezmoi doctor
        run: .github/scripts/ci-chezmoi-apply.sh doctor

      - name: Prefetch chezmoi externals
        id: chezmoi-prefetch
        if: steps.chezmoi-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOMAXPROCS: "1"
        run: .github/scripts/ci-chezmoi-apply.sh prefetch

      - name: Run chezmoi apply
        id: chezmoi-apply
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOMAXPROCS: "1"
          HOMEBREW_NO_AUTO_UPDATE: "1"
          CHEZMOI_APT_REPORT_DIR: ${{ runner.temp }}/integration-reports/apt
        run: .github/scripts/ci-chezmoi-apply.sh apply

      - name: Check SBX version
        run: .github/scripts/ci-chezmoi-apply.sh sbx-version

      # Use unique keys after failed applies so later runs can save more packages.
      - name: Save APT downloads
        if: ${{ always() && runner.os == 'Linux' && steps.apt-cache.outputs.cache-primary-key != '' && steps.apt-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.APT_CACHE_DIR }}/*.deb
          key: ${{ steps.chezmoi-apply.outcome == 'success' && steps.apt-cache.outputs.cache-primary-key || format('{0}-{1}-{2}', steps.apt-cache.outputs.cache-primary-key, github.run_id, github.run_attempt) }}

      # Save completed downloads even if apply fails or later integration steps fail.
      # Only failed applies use unique keys, so complete caches do not grow on every run.
      - name: Save chezmoi downloads
        if: ${{ !cancelled() && (steps.chezmoi-prefetch.outcome == 'failure' || steps.chezmoi-apply.outcome == 'success' || steps.chezmoi-apply.outcome == 'failure') && steps.chezmoi-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.CHEZMOI_CACHE_DIR }}
          key: ${{ steps.chezmoi-apply.outcome == 'success' && steps.chezmoi-cache.outputs.cache-primary-key || format('{0}-{1}-{2}', steps.chezmoi-cache.outputs.cache-primary-key, github.run_id, github.run_attempt) }}

      - name: Prune mise cache
        run: .github/scripts/ci-chezmoi-apply.sh mise-prune

      # Use the mise binary installed by chezmoi apply and load tools from the test HOME.
      - name: Install python dependencies for integration tests
        env:
          HOME: ${{ env.CHEZMOI_DEST }}
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run python:sync

      - name: Run system integration tests
        env:
          HOME: ${{ env.CHEZMOI_DEST }}
          GITHUB_TOKEN: ${{ github.token }}
          INTEGRATION_SUMMARY_RUNNER: ${{ matrix.os }}
        run: |
          set -o pipefail
          report_dir="$RUNNER_TEMP/integration-reports"
          mkdir -p "$report_dir"
          mise run test:integration -- -ra --durations=20 \
            --junitxml="$report_dir/pytest.xml" 2>&1 | tee "$report_dir/pytest.log"

      # Reuse .venv from integration setup when chezmoi apply succeeded; fall back to setup-mise otherwise.
      - name: Set up mise for Python tests
        id: python-test-setup
        if: ${{ !cancelled() && matrix.os != 'ubuntu-24.04-arm' && steps.checkout.outcome == 'success' && steps.chezmoi-apply.outcome != 'success' }}
        uses: $/.github/actions/setup-mise

      - name: Test Python packages
        if: ${{ !cancelled() && matrix.os != 'ubuntu-24.04-arm' && steps.checkout.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          report_dir="$RUNNER_TEMP/integration-reports"
          mkdir -p "$report_dir"
          if [[ "${{ steps.chezmoi-apply.outcome }}" == "success" ]]; then
            HOME="${{ env.CHEZMOI_DEST }}" mise run python:test -- --junitxml="$report_dir/python.xml"
          else
            mise run python:test -- --junitxml="$report_dir/python.xml"
          fi

      - name: Prune uv cache
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          if command -v uv >/dev/null 2>&1; then
            uv cache prune --ci
          elif [[ "${{ steps.chezmoi-apply.outcome }}" == "success" ]]; then
            HOME="${{ env.CHEZMOI_DEST }}" mise exec -- uv cache prune --ci
          fi

      - name: Publish test results and durations
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6.7.0
        with:
          report_paths: ${{ runner.temp }}/integration-reports/*.xml
          skip_annotations: true
          detailed_summary: true
          failed_summary_logs: true
          include_passed: true
          include_time_in_summary: true

      - name: Upload integration reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: integration-reports-${{ matrix.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/integration-reports/
          retention-days: 7
          if-no-files-found: ignore
