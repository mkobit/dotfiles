name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  UV_CACHE_DIR: /tmp/.uv-cache
  UV_PYTHON_INSTALL_DIR: /tmp/.uv-python
  MISE_CACHE_DIR: /tmp/.mise-cache
  BUN_INSTALL_CACHE_DIR: /tmp/.bun-cache
  CHEZMOI_CACHE_DIR: /tmp/.chezmoi-cache
  APT_CACHE_DIR: /tmp/.apt-cache
  CHEZMOI_CONFIG: /tmp/.chezmoi-config.toml
  CHEZMOI_DEST: /tmp/chezmoi-test
  CHEZMOI_VERSION: v2.73.3

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-mise
      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ runner.arch }}-${{ github.head_ref || github.ref_name }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ runner.arch }}-${{ github.head_ref || github.ref_name }}-
            uv-${{ runner.os }}-${{ runner.arch }}-main-
      - name: Install dependencies
        run: uv sync --all-packages --frozen
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Type check (ty)
        run: uv run ty check
      - name: Minimize uv cache
        run: uv cache prune --ci

  skill-filter-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-mise
      - name: Restore uv Python cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.UV_PYTHON_INSTALL_DIR }}
          key: uv-python-3.8-${{ runner.os }}-${{ runner.arch }}-${{ github.head_ref || github.ref_name }}
          restore-keys: |
            uv-python-3.8-${{ runner.os }}-${{ runner.arch }}-main
      - name: Install Python 3.8
        run: uv python install 3.8
      - name: Test skill_filter on Python 3.8
        env:
          PYTHONPATH: src/python/skill_filter
          UV_PYTHON_DOWNLOADS: manual
        run: uv run --no-project --python 3.8 --with pytest -- python -m pytest src/python/skill_filter/tests/ -q

  test:
    needs: [lint]
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-mise
      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ runner.arch }}-${{ github.head_ref || github.ref_name }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ runner.arch }}-${{ github.head_ref || github.ref_name }}-
            uv-${{ runner.os }}-${{ runner.arch }}-main-
      - name: Install dependencies
        run: uv sync --all-packages --frozen
      - name: Test
        run: uv run pytest src/python --cov --cov-report=term-missing
      - name: Build all packages
        run: uv build --all-packages
      - name: Minimize uv cache
        run: uv cache prune --ci

  integration:
    needs: [lint]
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Load scoped AppArmor profile for bwrap
        if: runner.os == 'Linux'
        # Ubuntu 24.04's AppArmor default blocks unprivileged CLONE_NEWUSER
        # for otherwise-unconfined processes, which bwrap needs for rootless
        # sandboxing -- without this, sandboxr's bwrap-backed integration
        # tests fail with "setting up uid map: Permission denied" /
        # "loopback: Failed RTM_NEWADDR". A profile scoped to /usr/bin/bwrap
        # that grants it `userns,` exempts only that binary; every other
        # process on the runner keeps the restriction, unlike flipping
        # kernel.apparmor_restrict_unprivileged_userns off runner-wide.
        # Ref: https://discourse.ubuntu.com/t/spec-unprivileged-user-namespace-restrictions-via-apparmor-in-ubuntu-23-10/37626
        run: |
          cat <<'PROFILE' | sudo tee /etc/apparmor.d/bwrap >/dev/null
          abi <abi/4.0>,

          /usr/bin/bwrap flags=(unconfined) {
            allow userns create,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/bwrap

      - name: Prepare APT download cache
        id: apt-cache-prepare
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$APT_CACHE_DIR"
          sudo install -d -o _apt -g root -m 0700 "$APT_CACHE_DIR/partial"
          printf 'Dir::Cache::archives "%s";\nAPT::Keep-Downloaded-Packages "true";\n' "$APT_CACHE_DIR" \
            | sudo tee /etc/apt/apt.conf.d/99-ci-download-cache >/dev/null
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore APT downloads
        id: apt-cache
        if: runner.os == 'Linux'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.APT_CACHE_DIR }}/*.deb
          key: apt-v1-${{ matrix.os }}-${{ runner.arch }}-${{ github.head_ref || github.ref_name }}-${{ steps.apt-cache-prepare.outputs.week }}-${{ hashFiles('src/chezmoi/.chezmoidata/packages/**', 'src/chezmoi/.chezmoi.toml.tmpl') }}
          restore-keys: |
            apt-v1-${{ matrix.os }}-${{ runner.arch }}-${{ github.head_ref || github.ref_name }}-
            apt-v1-${{ matrix.os }}-${{ runner.arch }}-main-

      - name: Restore chezmoi downloads
        id: chezmoi-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.CHEZMOI_CACHE_DIR }}
          key: chezmoi-cache-v4-${{ runner.os }}-${{ runner.arch }}-${{ github.head_ref || github.ref_name }}-${{ hashFiles('src/chezmoi/.chezmoidata/**', 'src/chezmoi/.chezmoidata.toml', 'src/chezmoi/**/.chezmoiexternals/**') }}
          restore-keys: |
            chezmoi-cache-v4-${{ runner.os }}-${{ runner.arch }}-${{ github.head_ref || github.ref_name }}-${{ hashFiles('src/chezmoi/.chezmoidata/**', 'src/chezmoi/.chezmoidata.toml', 'src/chezmoi/**/.chezmoiexternals/**') }}-
            chezmoi-cache-v4-${{ runner.os }}-${{ runner.arch }}-${{ github.head_ref || github.ref_name }}-
            chezmoi-cache-v4-${{ runner.os }}-${{ runner.arch }}-main-

      - name: Cache skill-filter output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          # Apply uses the runner home; integration pytest uses CHEZMOI_DEST as HOME.
          path: |
            ~/.cache/skill-filter
            ${{ env.CHEZMOI_DEST }}/.cache/skill-filter
          key: skill-filter-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/python/skill_filter/**') }}-${{ github.head_ref || github.ref_name }}-${{ hashFiles('src/chezmoi/.chezmoidata/ai/**', 'src/chezmoi/.chezmoi.toml.tmpl', 'src/chezmoi/.chezmoiexternals/ai-*.toml.tmpl') }}
          restore-keys: |
            skill-filter-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/python/skill_filter/**') }}-${{ github.head_ref || github.ref_name }}-
            skill-filter-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/python/skill_filter/**') }}-main-

      - name: Cache mise downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.MISE_CACHE_DIR }}
          key: mise-cache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.head_ref || github.ref_name }}-${{ hashFiles('src/chezmoi/.chezmoidata/bin/mise.toml') }}
          restore-keys: |
            mise-cache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.head_ref || github.ref_name }}-
            mise-cache-v1-${{ runner.os }}-${{ runner.arch }}-main-

      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: bun-cache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.head_ref || github.ref_name }}-${{ hashFiles('src/chezmoi/.chezmoidata/bin/mise.toml') }}
          restore-keys: |
            bun-cache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.head_ref || github.ref_name }}-
            bun-cache-v1-${{ runner.os }}-${{ runner.arch }}-main-

      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ runner.arch }}-${{ github.head_ref || github.ref_name }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ runner.arch }}-${{ github.head_ref || github.ref_name }}-
            uv-${{ runner.os }}-${{ runner.arch }}-main-

      - name: Install chezmoi
        run: |
          sh -c "$(curl --retry 5 -fsLS get.chezmoi.io)" -- -b ~/.local/bin -t ${{ env.CHEZMOI_VERSION }}
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Initialize chezmoi
        run: |
          mkdir -p ${{ env.CHEZMOI_DEST }}
          chezmoi init \
            --cache=${{ env.CHEZMOI_CACHE_DIR }} \
            --source=${{ github.workspace }} \
            --destination=${{ env.CHEZMOI_DEST }} \
            --config=${{ env.CHEZMOI_CONFIG }}

      - name: Run chezmoi doctor
        run: |
          chezmoi doctor \
            --cache=${{ env.CHEZMOI_CACHE_DIR }} \
            --config=${{ env.CHEZMOI_CONFIG }} \
            --source=${{ github.workspace }} \
            --destination=${{ env.CHEZMOI_DEST }} \
            --no-network

      - name: Run chezmoi apply
        id: chezmoi-apply
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOMAXPROCS: "1"
        run: |
          set -o pipefail
          report_dir="$RUNNER_TEMP/integration-reports"
          mkdir -p "$report_dir"
          # externals have no retry option; cached downloads survive, so retries refetch only failures
          for attempt in 1 2 3 4 5 6; do
            chezmoi apply \
              --cache=${{ env.CHEZMOI_CACHE_DIR }} \
              --config=${{ env.CHEZMOI_CONFIG }} \
              --source=${{ github.workspace }} \
              --destination=${{ env.CHEZMOI_DEST }} 2>&1 | tee "$report_dir/chezmoi-apply-$attempt.log" && exit 0
            echo "::warning::chezmoi apply attempt $attempt failed"
            if [ "$attempt" -lt 6 ]; then
              sleep $((15 * 2 ** (attempt - 1)))
            fi
          done
          exit 1

      # Use unique keys after failed applies so later runs can save more packages.
      - name: Save APT downloads
        if: ${{ always() && runner.os == 'Linux' && steps.apt-cache.outputs.cache-primary-key != '' && steps.apt-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.APT_CACHE_DIR }}/*.deb
          key: ${{ steps.chezmoi-apply.outcome == 'success' && steps.apt-cache.outputs.cache-primary-key || format('{0}-{1}-{2}', steps.apt-cache.outputs.cache-primary-key, github.run_id, github.run_attempt) }}

      # Save completed downloads even if apply fails or later integration steps fail.
      # Only failed applies use unique keys, so complete caches do not grow on every run.
      - name: Save chezmoi downloads
        if: ${{ !cancelled() && (steps.chezmoi-apply.outcome == 'success' || steps.chezmoi-apply.outcome == 'failure') && steps.chezmoi-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.CHEZMOI_CACHE_DIR }}
          key: ${{ steps.chezmoi-apply.outcome == 'success' && steps.chezmoi-cache.outputs.cache-primary-key || format('{0}-{1}-{2}', steps.chezmoi-cache.outputs.cache-primary-key, github.run_id, github.run_attempt) }}

      - name: Prune mise cache
        run: |
          MISE_BIN_DIR=$(chezmoi \
            --config=${{ env.CHEZMOI_CONFIG }} \
            --source=${{ github.workspace }} \
            --destination=${{ env.CHEZMOI_DEST }} \
            target-path ${{ github.workspace }}/src/chezmoi/dot_local/bin)
          echo "$MISE_BIN_DIR" >> $GITHUB_PATH
          "$MISE_BIN_DIR/mise" cache prune --yes

      - name: Install python dependencies for integration tests
        env:
          HOME: ${{ env.CHEZMOI_DEST }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mise exec -- uv sync --all-packages --frozen

      - name: Run system integration tests
        env:
          HOME: ${{ env.CHEZMOI_DEST }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          report_dir="$RUNNER_TEMP/integration-reports"
          mkdir -p "$report_dir"
          mise exec -- uv run pytest tests/integration -ra --durations=20 \
            --junitxml="$report_dir/pytest.xml" 2>&1 | tee "$report_dir/pytest.log"

      - name: Upload integration reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: integration-reports-${{ matrix.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/integration-reports/
          retention-days: 7
          if-no-files-found: ignore
