name: OpenShell image

on:
  push:
    branches: [main]
    paths: &image-inputs
      - .github/workflows/openshell-image.yml
      - .chezmoiroot
      - .dockerignore
      - .gitattributes
      - mise.toml
      - mise.lock
      - src/chezmoi/**
      - src/openshell/images/shared/**
      - src/python/skill_filter/**
      - src/python/*/pyproject.toml
  pull_request:
    branches: [main]
    paths: *image-inputs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-image:
    name: Build and smoke-test shared image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-mise
      - name: Cache BuildKit layers
        uses: actions/cache@v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: buildx-openshell-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/openshell/images/shared/Dockerfile', 'src/openshell/images/shared/sandbox-chezmoi.toml', 'src/chezmoi/.chezmoidata/bin/**', 'src/chezmoi/.chezmoidata/ai/**', 'src/chezmoi/.chezmoi.toml.tmpl') }}
          restore-keys: |
            buildx-openshell-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up Docker Buildx builder
        run: |
          if ! docker buildx inspect ci-builder >/dev/null 2>&1; then
            docker buildx create --name ci-builder --driver docker-container --use
          else
            docker buildx use ci-builder
          fi
      - name: Build from tracked files
        env:
          OPENSHELL_BUILD_CACHE_FROM: /tmp/.buildx-cache
          OPENSHELL_BUILD_CACHE_TO: /tmp/.buildx-cache-new
        run: |
          mise run openshell:build
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
      - name: Smoke-test the sandbox environment
        run: mise run openshell:smoke-test
