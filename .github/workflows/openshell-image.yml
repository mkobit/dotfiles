name: OpenShell image

on:
  push:
    branches: [main]
    paths: &image-inputs
      - .github/workflows/openshell-image.yml
      - .chezmoiroot
      - .dockerignore
      - .gitattributes
      - mise.toml
      - mise.lock
      - src/chezmoi/**
      - src/openshell/images/shared/**
      - src/python/skill_filter/**
      - src/python/*/pyproject.toml
  pull_request:
    branches: [main]
    paths: *image-inputs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-image:
    name: Build and smoke-test shared image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-mise
      - name: Build from tracked files
        run: mise run openshell:build
      - name: Smoke-test the sandbox environment
        run: mise run openshell:smoke-test
