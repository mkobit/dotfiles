name: Set up mise
description: Install mise at the repository version and its tools.
runs:
  using: composite
  steps:
    - name: Read mise version
      id: mise-version
      shell: bash
      run: |
        python3 - <<'PY'
        import os
        import tomllib

        with open("src/chezmoi/.chezmoidata/bin/mise.toml", "rb") as source:
            version = tomllib.load(source)["bin"]["mise"]["version"]
        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            print(f"version={version.removeprefix('v')}", file=output)
        PY
    - uses: jdx/mise-action@8008c3f4db491fde6fd6d72dc97fbdb752dac949
      with:
        version: ${{ steps.mise-version.outputs.version }}
