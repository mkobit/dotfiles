name: Set up chezmoi
description: Install chezmoi at the specified version and add it to PATH.
inputs:
  version:
    description: Chezmoi release tag to install.
    default: v2.74.0
    required: false
  install-dir:
    description: Directory to install the chezmoi binary into.
    default: ${{ runner.temp }}/chezmoi-bin
    required: false
runs:
  using: composite
  steps:
    - name: Install chezmoi
      shell: bash
      env:
        CHEZMOI_VERSION: ${{ inputs.version }}
        INSTALL_DIR: ${{ inputs.install-dir }}
      run: |
        set -euo pipefail
        mkdir -p "$INSTALL_DIR"
        for attempt in 1 2 3 4 5; do
          if sh -c "$(curl --retry 5 -fsLS "https://raw.githubusercontent.com/twpayne/chezmoi/${CHEZMOI_VERSION}/assets/scripts/install.sh")" -- -b "$INSTALL_DIR" -t "$CHEZMOI_VERSION"; then
            echo "$INSTALL_DIR" >> "$GITHUB_PATH"
            exit 0
          fi
          echo "::warning::chezmoi install attempt $attempt failed"
          if [[ "$attempt" -lt 5 ]]; then
            sleep $((5 * attempt))
          fi
        done
        exit 1
