name: Set up chezmoi
description: Install chezmoi at the specified version and add it to PATH.
inputs:
  version:
    description: Chezmoi release tag to install.
    default: v2.74.0
    required: false
runs:
  using: composite
  steps:
    - name: Install chezmoi
      shell: bash
      env:
        CHEZMOI_VERSION: ${{ inputs.version }}
        INSTALL_DIR: ${{ runner.temp }}/chezmoi-bin
      run: |
        set -euo pipefail
        version="${CHEZMOI_VERSION#v}"
        case "$RUNNER_OS" in
          Linux) os=linux ;;
          macOS) os=darwin ;;
          *) echo "Unsupported OS: $RUNNER_OS" >&2; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "Unsupported arch: $RUNNER_ARCH" >&2; exit 1 ;;
        esac

        tarball="chezmoi_${version}_${os}_${arch}.tar.gz"
        checksums="chezmoi_${version}_checksums.txt"
        base_url="https://github.com/twpayne/chezmoi/releases/download/${CHEZMOI_VERSION}"

        tmpdir=$(mktemp -d)
        trap 'rm -rf -- "$tmpdir"' EXIT

        curl --retry 5 -fsSL -o "$tmpdir/$tarball" "$base_url/$tarball"
        curl --retry 5 -fsSL -o "$tmpdir/$checksums" "$base_url/$checksums"

        expected_sha=$(awk -v file="$tarball" '$2 == file { print $1 }' "$tmpdir/$checksums")
        if [[ -z "$expected_sha" ]]; then
          echo "Checksum entry not found for $tarball" >&2
          exit 1
        fi
        if command -v sha256sum >/dev/null 2>&1; then
          actual_sha=$(sha256sum "$tmpdir/$tarball" | awk '{ print $1 }')
        else
          actual_sha=$(shasum -a 256 "$tmpdir/$tarball" | awk '{ print $1 }')
        fi
        if [[ "$actual_sha" != "$expected_sha" ]]; then
          echo "Checksum mismatch for $tarball: expected $expected_sha, got $actual_sha" >&2
          exit 1
        fi

        mkdir -p "$INSTALL_DIR"
        tar -xzf "$tmpdir/$tarball" -C "$INSTALL_DIR" chezmoi
        chmod +x "$INSTALL_DIR/chezmoi"
        echo "$INSTALL_DIR" >> "$GITHUB_PATH"
