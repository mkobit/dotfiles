schemaVersion: "2"
kind: mixin
name: mise
displayName: Mise Developer Toolchain
description: Installs pinned mise v2026.8.10, configures dev toolchain shims, and proxies GitHub authentication in sandbox environments

environment:
  variables:
    MISE_VERSION: "v2026.8.10"
    MISE_DATA_DIR: "/home/agent/.local/share/mise"
    MISE_CONFIG_DIR: "/home/agent/.config/mise"
    PATH: "/home/agent/.local/share/mise/shims:/home/agent/.local/bin:/usr/local/bin:/usr/bin:/bin"

setup:
  install:
    - command: "sh -c 'curl -fsSL https://mise.run | MISE_VERSION=v2026.8.10 sh'"
  startup:
    - command:
        - mise
        - trust
        - --all

credentials:
  - service: github
    description: Host GitHub credentials for authenticated git operations and API rate limits

permissions:
  network:
    allow:
      - mise.jdx.dev:443
      - github.com:443
      - api.github.com:443
      - codeload.github.com:443
      - objects.githubusercontent.com:443
      - raw.githubusercontent.com:443
      - nodejs.org:443
      - registry.npmjs.org:443
      - pypi.org:443
      - files.pythonhosted.org:443
      - crates.io:443
      - static.crates.io:443
