schemaVersion: "2"
kind: mixin
name: git-config
displayName: Git Configuration and Identity
description: Configures Git user identity, safe directory boundaries, and commit signing policy in sandbox environments

environment:
  variables:
    GIT_AUTHOR_NAME: "mkobit"
    GIT_AUTHOR_EMAIL: "mkobit@users.noreply.github.com"
    GIT_COMMITTER_NAME: "mkobit"
    GIT_COMMITTER_EMAIL: "mkobit@users.noreply.github.com"

setup:
  install:
    - command: "git config --global --add safe.directory '*'"
    - command: "git config --global commit.gpgsign false"
