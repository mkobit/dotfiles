schemaVersion: "2"
kind: mixin
name: chezmoi-init
displayName: Chezmoi Dotfiles Bootstrap
description: Installs pinned chezmoi v2.72.0 and initializes dotfiles management in sandbox environments

environment:
  variables:
    CHEZMOI_VERSION: "v2.72.0"
    CHEZMOI_DESTDIR: "/home/agent"
    PATH: "/home/agent/.local/bin:/usr/local/bin:/usr/bin:/bin"

setup:
  install:
    - command: "sh -c 'curl -fsLS https://get.chezmoi.io | sh -s -- -b /home/agent/.local/bin -t v2.72.0'"
  startup:
    - command:
        - chezmoi
        - init
        - --apply
        - --source=/workspace/src/chezmoi
        - --destination=/home/agent

permissions:
  network:
    allow:
      - get.chezmoi.io:443
      - github.com:443
      - api.github.com:443
      - objects.githubusercontent.com:443
      - raw.githubusercontent.com:443
