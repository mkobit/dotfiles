[project]
name = "termstatus"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "rich>=14",
    "typer>=0.27.0",
    "whenever>=0.10.3",
]

[project.scripts]
statusline = "termstatus.main:main"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
