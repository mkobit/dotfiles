[project]
name = "jules-cli"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3",
    "pydantic>=2.13.4",
    "typer>=0.24.1",
    "whenever>=0.10.3",
]

[project.scripts]
jules = "jules_cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
