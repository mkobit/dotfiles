{{- /* chezmoi:modify-template */ -}}
{{- $config := dict -}}
{{- if .chezmoi.stdin -}}
{{-   $config = fromToml .chezmoi.stdin -}}
{{- end -}}
{{- $vimModeDefault := dig "codex" "tui" "vim_mode_default" true . -}}
{{- $statusLine := dig "codex" "tui" "status_line" (list) . -}}
{{- $statusLineUseColors := dig "codex" "tui" "status_line_use_colors" true . -}}
{{- $telemetryEnabled := dig "codex" "telemetry" "enabled" nil . -}}
{{- $hasTelemetryEnabled := ne $telemetryEnabled nil -}}
{{- $logUserPrompt := dig "codex" "telemetry" "log_user_prompt" nil . -}}
{{- $hasLogUserPrompt := ne $logUserPrompt nil -}}
{{- $autoCompactTokenLimit := dig "ai" "context_management" "codex" "auto_compact_token_limit" nil . -}}
{{- $hasAutoCompactTokenLimit := ne $autoCompactTokenLimit nil -}}
{{- $matches := and
        (eq (dig "tui" "vim_mode_default" nil $config) $vimModeDefault)
        (deepEqual (dig "tui" "status_line" nil $config) $statusLine)
        (eq (dig "tui" "status_line_use_colors" nil $config) $statusLineUseColors)
        (or
          (not $hasTelemetryEnabled)
          (and
            $hasTelemetryEnabled
            (eq (dig "analytics" "enabled" nil $config) $telemetryEnabled)
            (eq (dig "feedback" "enabled" nil $config) $telemetryEnabled)
          )
        )
        (or
          (not $hasLogUserPrompt)
          (and
            $hasLogUserPrompt
            (eq (dig "otel" "log_user_prompt" nil $config) $logUserPrompt)
          )
        )
        (or
          (not $hasAutoCompactTokenLimit)
          (and
            (hasKey $config "model_auto_compact_token_limit")
            (eq
              (int (dig "model_auto_compact_token_limit" nil $config))
              (int $autoCompactTokenLimit)
            )
          )
        )
  -}}
{{- if $matches -}}
{{-   .chezmoi.stdin -}}
{{- else -}}
{{-   warnf "Codex managed settings changed; rewriting config.toml may canonicalize formatting" -}}
{{-   $config = $config | setValueAtPath "tui.vim_mode_default" $vimModeDefault -}}
{{-   $config = $config | setValueAtPath "tui.status_line" $statusLine -}}
{{-   $config = $config | setValueAtPath "tui.status_line_use_colors" $statusLineUseColors -}}
{{-   if $hasTelemetryEnabled -}}
{{-     $config = $config | setValueAtPath "analytics.enabled" $telemetryEnabled -}}
{{-     $config = $config | setValueAtPath "feedback.enabled" $telemetryEnabled -}}
{{-   end -}}
{{-   if $hasLogUserPrompt -}}
{{-     $config = $config | setValueAtPath "otel.log_user_prompt" $logUserPrompt -}}
{{-   end -}}
{{-   if $hasAutoCompactTokenLimit -}}
{{-     $config = $config | setValueAtPath "model_auto_compact_token_limit" $autoCompactTokenLimit -}}
{{-   end -}}
{{-   $config | toToml -}}
{{- end -}}
