# Unbind Ghostty's default alt+arrow overrides — pass through to shell vim mode.
keybind = alt+arrow_left=unbind
keybind = alt+arrow_right=unbind

# cmd+t: keep Ghostty's new-tab action, but also pass the keystroke through to
# the foreground program via the kitty keyboard protocol (unconsumed:). Zellij
# binds "Super t" to NewTab so pressing cmd+t inside a zellij session opens a
# zellij tab in addition to Ghostty's own new tab.
keybind = unconsumed:cmd+t=new_tab
