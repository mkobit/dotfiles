# Authored skill exceptions. Skills are discovered from src/ai/skills/<name>/ and deploy to every
# selected view without a key; a key here only deselects: "absent", or one of "claude", "codex",
# "cursor", "antigravity". Catalog-level exclusions of sources that stay in the repository live here:
# example_skill is a sample that deploys nowhere.
# Deleting a skill source needs no key; the root cleanup removes its deployed roots.
[ai.skills.authored]
example_skill = "absent"
