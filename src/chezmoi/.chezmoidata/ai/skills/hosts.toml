# AI skill deployment catalog.
#
# Skills are deployed as static files by chezmoi externals (see .chezmoiexternals/ai-skills.toml.tmpl).
# Each upstream is pinned to an exact commit and archive checksum.
# The archive is piped through src/python/skill_filter at apply time to extract one skill per external.
# Skills marked "absent" are pruned via the .chezmoiremove.tmpl files in dot_claude/, dot_gemini/, dot_cursor/, and dot_codex/;
# keep the key when deselecting a skill — deleting it outright orphans any installed copy.
#
# Every present skill installs to every tool's skill directory; the target
# directories are hardcoded in the externals and removal templates above.
#
# Overlay and per-machine composition (config data takes key-path precedence over these files):
# - Proxy GitHub downloads:   [data.ai.skills.hosts.github] url_format = "https://artifacts.corp/github/{repo}/tar.gz/{ref}"
# - Add an internal host:     [ai.skills.hosts.ghe] url_format = "https://ghe.corp/api/v3/repos/{repo}/tarball/{ref}"
#   in an overlay .chezmoidata file, then set host = "ghe" on overlay sources.
# - Remove one skill:         [data.ai.skills.external.superpowers.skills] brainstorming = "absent"
# - Add overlay-only sources in an overlay .chezmoidata file under distinct [ai.skills.external.<name>] keys.

# Archive hosts: each url_format substitutes {repo} and {ref} from the source entry.
[ai.skills.hosts.github]
url_format = "https://codeload.github.com/{repo}/tar.gz/{ref}"

# External sources in this directory use [ai.skills.external.<name>] with repo,
# ref (commit SHA), and sha256 (downloaded archive).
# Optional: host (archive host key, default "github"), skills_root (default "skills"),
# url (full archive URL for one-off published artifacts, bypasses host construction),
# skill_file (for a flat, single-skill repo with SKILL.md at the archive root
# instead of a skills_root/<name>/ subdirectory — selects that bare file directly;
# the [.skills] entry's key still names the installed skill directory).
# Each [.skills] entry maps an upstream skill directory name to a state:
# "present" (all tools), "absent" (pruned everywhere), or a single tool name
# ("claude", "antigravity", "cursor") to deploy only to that tool.
