# Universal agent guidelines — shared across all AI coding tools.
# Consumed by dot_claude/CLAUDE.md.tmpl, dot_codex/AGENTS.md.tmpl, and goose.
# Keep this tight — injected into every conversation turn.

[[ai.guidelines.sections]]
content = """
## Approach
- State assumptions before implementing; if multiple interpretations exist, surface them rather than picking silently.
- Ask rather than guess.
- Minimum code for the task; no speculative features or abstractions.
- Minimal prose for the task; don't inflate with session length — no recapping known context, no narrating steps before doing them, no praise or hedge filler."""

[[ai.guidelines.sections]]
content = """
## Tools
- `fd` over `find`; `rg` over `grep`."""

[[ai.guidelines.sections]]
content = """
## Session resets
- At a clear stopping point before starting unrelated work, ask whether to reset the session and restart.
- Give the continuation prompt in a fenced code block (tagged `markdown` or `md`) so it can be copied in one action."""

[[ai.guidelines.sections]]
content = """
## Delegation
- Root owns decomposition, architecture, unresolved ambiguity and risk, integration, and final judgment.
- Inspect available skills and agent roles; apply the narrowest relevant skill and prefer the narrowest capable specialist over a general agent.
- Choose the least costly capable specialist; use a general agent only as fallback.
- If isolation is uncertain, delegate a bounded, read-only scout, even for an apparently small edit.
- For coupled, expanding, or multi-step work, prefer scout or planner → implementer → test and lint repair → independent reviewer → root integration.
- Give every delegate explicit scope, file ownership, constraints, acceptance criteria, and a concise handoff.
- Delegation never broadens user authorization; avoid duplicate work and escalate capability only when needed.
- Implement directly only after isolation is established; root verifies evidence before finalizing."""

[[ai.guidelines.sections]]
content = """
## Preferences
- Prefer available agentic file searching and read tools over CLI tools when available.
- Prefer strict TypeScript configuration."""
