# Universal agent guidelines — shared across all AI coding tools.
# Consumed by dot_claude/CLAUDE.md.tmpl, dot_codex/AGENTS.md.tmpl, and goose.
# Keep this tight — injected into every conversation turn.

[[ai.guidelines.sections]]
content = """
## Writing style
- Only speak to me in ASD-STE100 Simplified Technical English.
- Use sentence case in all authored files, including documentation and agent notes, and in headings, commits, PR titles, and UI labels.
- Prefer one sentence per line when it helps editing and renders as a paragraph.
  Otherwise, use one space between sentences.
- Codify tools, commands, and syntax with target output markup.
- Source links (docs, code, issues) in PR descriptions, Slack drafts, and research summaries.
- Slack, email, and Jira message bodies: lowercase except proper nouns; PR bodies use sentence case.
- Front-load the action, use facts, and omit filler adjectives.
- Example — instead of "We introduced a shared config to ensure consistency across tools" → "Creates `guidelines.toml` as single source for all tools, one-line changes propagate everywhere"."""

[[ai.guidelines.sections]]
content = """
## Approach
- State assumptions before implementing; if multiple interpretations exist, surface them rather than picking silently.
- Ask rather than guess.
- Minimum code for the task; no speculative features or abstractions.
- Minimal prose for the task; don't inflate with session length — no recapping known context, no narrating steps before doing them, no praise or hedge filler."""

[[ai.guidelines.sections]]
content = """
## Tools
- `fd` over `find`; `rg` over `grep`."""

[[ai.guidelines.sections]]
content = """
## Session resets
- At a clear stopping point before starting unrelated work, ask whether to reset the session and restart.
- Give the continuation prompt in a fenced code block (tagged `markdown` or `md`) so it can be copied in one action."""

[[ai.guidelines.sections]]
content = """
## Delegation
- Delegate questions that need research, including follow-up probes, to a read-only subagent by default when session rules permit.
- Use a fast model for simple lookups and a stronger model for complex analysis.
- Delegate independent implementation when it has a clear scope and file ownership.
- Give each delegate a bounded scope and each writer file ownership; use available isolation and verify results.
- Use `mkobit-dotfiles:delegating-tasks` when available."""

[[ai.guidelines.sections]]
content = """
## Preferences
- Prefer available agentic file searching and read tools over CLI tools when available.
- Prefer strict TypeScript configuration.
- When a worktree is used, prefer creating it locally in `.worktrees/` (globally ignored via chezmoi)."""

[[ai.guidelines.sections]]
content = """
## Modern web guidance
- Repositories that require modern web guidance must track `.agents/skills/modern-web-guidance/` and its installation in `skills-lock.json`.
- Require `modern-web-guidance` as a local `package.json` devDependency so `bun x modern-web-guidance` works offline in under one second after dependency installation.
- Respect `minimumReleaseAge`; do not bypass it globally."""

[[ai.guidelines.sections]]
content = """
## Testing
- Scope ambiguous or high-risk business constraints with the test-invariants skill before writing tests.
- Write and expand tests with the black-box-testing skill from public contracts, data tables, and iterable inspectors without mirroring private implementation branches."""
