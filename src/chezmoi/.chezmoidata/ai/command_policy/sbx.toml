# Docker Sandboxes (sbx) CLI: safe read-only inspection, help, and artifact validation.
#
# Deliberately excluded — do not add:
#   - "sbx run", "sbx create", "sbx exec": provisioning, starting, or executing
#     sandboxes from the host requires human confirmation because it spawns
#     host microVMs/containers, mounts workspaces, and allocates host resources.
#   - "sbx rm", "sbx reset", "sbx stop": lifecycle teardown and state destruction
#     of existing sandboxes; always prompt to avoid accidental container deletion.
#   - "sbx login", "sbx logout": authenticates or wipes Docker cloud auth state;
#     always prompt.
#   - "sbx daemon": manages host-level sandbox daemon process; always prompt.
#   - "sbx secret set", "sbx secret rm": mutates host-managed secrets store;
#     always prompt.
#   - "sbx policy allow", "sbx policy deny", "sbx policy rm", "sbx policy init",
#     "sbx policy reset": mutates persistent access policies; always prompt.
#   - "sbx mcp add", "sbx mcp auth", "sbx mcp rm", "sbx mcp load": registers,
#     authorizes, or mutates MCP servers; always prompt.
[ai.command_policy.commands]
"sbx --help" = "allow"
"sbx completion --help" = "allow"
"sbx completion" = "allow"
"sbx cp --help" = "allow"
"sbx create --help" = "allow"
"sbx daemon --help" = "allow"
"sbx diagnose --help" = "allow"
"sbx diagnose" = "allow"
"sbx exec --help" = "allow"
"sbx kit --help" = "allow"
"sbx kit inspect --help" = "allow"
"sbx kit inspect" = "allow"
"sbx kit pack --help" = "allow"
"sbx kit pack" = "allow"
"sbx kit validate --help" = "allow"
"sbx kit validate" = "allow"
"sbx ls --help" = "allow"
"sbx ls" = "allow"
"sbx mcp --help" = "allow"
"sbx mcp inspect --help" = "allow"
"sbx mcp inspect" = "allow"
"sbx mcp ls --help" = "allow"
"sbx mcp ls" = "allow"
"sbx policy --help" = "allow"
"sbx policy check --help" = "allow"
"sbx policy check" = "allow"
"sbx policy ls --help" = "allow"
"sbx policy ls" = "allow"
"sbx ports --help" = "allow"
"sbx reset --help" = "allow"
"sbx rm --help" = "allow"
"sbx run --help" = "allow"
"sbx secret --help" = "allow"
