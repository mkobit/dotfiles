# Local Git operations and the selected workflow push.
# Bare git push and force push are not granted. The shipping task must check
# the branch, remote, PR identity, and head revision before publication.
# Command-head matching does not validate appended arguments.
# git reset and git clean can destroy uncommitted or untracked work.
# Keep them outside this allow catalog.
[ai.command_policy.commands]
"git add" = "allow"
"git blame" = "allow"
"git branch" = "allow"
"git check-ignore" = "allow"
"git checkout" = "allow"
"git cherry-pick" = "allow"
"git commit" = "allow"
"git diff" = "allow"
"git fetch" = "allow"
"git grep" = "allow"
"git log" = "allow"
"git ls-files" = "allow"
"git merge" = "allow"
"git merge-base" = "allow"
"git mv" = "allow"
"git pull" = "allow"
"git push --set-upstream origin HEAD" = "allow"
"git rebase" = "allow"
"git remote -v" = "allow"
"git restore" = "allow"
"git rev-parse" = "allow"
"git show" = "allow"
"git stash" = "allow"
"git status" = "allow"
"git switch" = "allow"
"git worktree list" = "allow"
