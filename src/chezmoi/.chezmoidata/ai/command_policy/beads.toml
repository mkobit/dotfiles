# Beads (bd) issue tracker: agents own the full local issue lifecycle,
# including destructive ops (delete/purge/prune/gc/compact/flatten/
# rename-prefix/forget) — beads keeps its own recovery path (backup, vc,
# dolt history), so these are treated like git.toml's local/reversible
# git subcommands, not excluded on "destructive" grounds alone. bd is
# meant to be nearly always agent-driven — unlike git, where a push is
# visible to other people/CI on a shared remote, bd's dolt remote isn't
# — so "bd dolt push" is allowed despite carrying the same remote-write
# shape as "git push". Deliberate divergence from git.toml's bar, not
# an oversight.
#
# Deliberately excluded — do not add:
#   - "bd dolt pull", "bd dolt remote": still prompt-gated — pulling in
#     changes from elsewhere or reconfiguring the remote aren't the
#     agent's own local work the way push is.
#   - "bd federation": peer-to-peer sync with other workspaces, not in
#     use anywhere yet — always prompt if that changes.
#   - "bd sql": raw SQL escape hatch that bypasses bd's storage layer
#     and audit trail entirely — always prompt.
#   - "bd migrate": schema/repo-structure migration, expected to run
#     rarely — always prompt.
#   - "bd upgrade": denied outright (not just ask) — bd is installed
#     and version-pinned via mise; its own upgrade-tracking should
#     never run under agent control.
#   - "bd github"/"bd gitlab"/"bd notion"/"bd ado"/"bd jira"/"bd linear":
#     push/pull/sync against third-party services using their own
#     credentials — same remote-write shape as "git push", but unlike
#     "bd dolt push" it's not bd's own storage, so it keeps git.toml's
#     bar rather than the divergence above.
#   - "bd mail": delegates to an external mail provider — sends outbound
#     communication, always prompt.
#   - "bd admin reset": wipes all local data *and* configuration, not
#     just issues — more severe than any allowed destructive op, same
#     rare/high-blast-radius bar as "bd migrate".
#   - "bd repo sync": hydrates issues in from other local repos — not
#     the agent's own local work, same reasoning as "bd dolt pull".
[ai.command_policy.commands]
"bd admin cleanup" = "allow"
"bd admin compact" = "allow"
"bd assign" = "allow"
"bd audit" = "allow"
"bd backup" = "allow"
"bd batch" = "allow"
