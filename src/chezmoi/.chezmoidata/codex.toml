# Host defaults. Keep the selector scheme compatible with the live base file.
[codex.permissions]
approval_policy = "on-request"
default_permissions = ":workspace"
sandbox_mode = "workspace-write"

[codex.tui]
vim_mode_default = true

# Observed Codex TUI components; no stable upstream configuration reference is
# currently available. Keep the ordering deliberate.
status_line = [
  "model-with-reasoning",
  "current-dir",
  "project-name",
  "git-branch",
  "run-state",
  "permissions",
  "context-remaining",
  "task-progress",
]
status_line_use_colors = true
