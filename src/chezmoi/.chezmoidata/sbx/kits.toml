# Docker Sandboxes (sbx) kit deployment catalog.
#
# External kits are downloaded from pinned upstream archives via chezmoi externals
# (see .chezmoiexternals/sbx-kits.toml.tmpl) and deployed to ~/.local/share/sbx/external/<kind>/<name>/.
#
# Authored kits live under src/sbx/sandboxes/<name>/ and src/sbx/mixins/<name>/.

[sbx.kits.hosts.github]
url_format = "https://codeload.github.com/{repo}/tar.gz/{ref}"

[sbx.kits.authored.mixins]
chezmoi-init = "present"
git-config = "present"
mise = "present"

[sbx.kits.authored.sandboxes]
agy = "present"
