# Configuration documentation: https://geminicli.com/docs/get-started/configuration/

[gemini]
model = "auto-gemini-3"

[gemini.telemetry]
enabled = false
log_prompts = false

[gemini.ui]
show_line_numbers = true
show_memory_usage = true
show_model_info_in_chat = true

[gemini.ui.footer]
hide_context_percentage = false

[gemini.general]
enable_auto_update = false
preview_features = true
show_feedback_survey = false
vim_mode = true
vim_insert_first = true

# Default keybindings reference: https://antigravity.google/docs/cli/reference/#default-keybindings
# Vim keybindings customization: https://antigravity.google/docs/cli/vim-editor-mode/#customize-the-submit-and-newline-keys
[gemini.keybindings]
"vim.insert.insert_newline" = ["alt+enter", "ctrl+j", "shift+enter"]
"vim.insert.submit" = ["ctrl+enter", "ctrl+s", "enter"]

# Session Management: https://developers.googleblog.com/pick-up-exactly-where-you-left-off-with-session-management-in-gemini-cli/
[gemini.general.sessionRetention]
enabled = true
max_age = "30d"
warning_acknowledged = true

# Sandbox Configuration: https://geminicli.com/docs/cli/sandbox/
[gemini.tools]
# Disabled globally due to current complexity using existing tools like git
sandbox = false
sandbox_allowed_paths = ["~/"]

[gemini.extensions]


[gemini.context]
include_directories = ["~/.config/gh"]

[gemini.experimental]
worktrees = true
