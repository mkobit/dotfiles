linux_amd64  = "474430d53e6264f6d6dd18db42d6dc9df3a1b56ca9e88a325bbf860e1a811d87"
linux_arm64  = "8f1f64a0bdb97247034038c3823c6cbad5bdf9ecd5751b85494b71c3ee04c815"

[bin.nvim.homebrew]
name = "neovim"
cask = false
