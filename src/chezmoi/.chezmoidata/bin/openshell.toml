executable      = true
checksum_type   = "sha256"
tag_format      = "v{version}"
filename_format = "openshell-gateway-{target}.tar.gz"
path_format     = "openshell-gateway"
url_format      = "{base}/{repo}/releases/download/{tag}/{filename}"
platforms.linux_amd64 = "x86_64-unknown-linux-gnu"
checksums.linux_amd64 = "c32085d64ccef037121c0e87bee1a57d6e886d77f77bb8b260cb08f0a6cce6a3"

