[bin.openshell]
version = "0.1.9"

[bin.openshell.github_releases]
repo            = "NVIDIA/OpenShell"
external_type   = "archive-file"
executable      = true
checksum_type   = "sha256"
tag_format      = "v{version}"
filename_format = "openshell-{target}.tar.gz"
path_format     = "openshell"
url_format      = "{base}/{repo}/releases/download/{tag}/{filename}"

[bin.openshell.github_releases.platforms]
darwin_arm64 = "aarch64-apple-darwin"
linux_amd64  = "x86_64-unknown-linux-musl"
linux_arm64  = "aarch64-unknown-linux-musl"

[bin.openshell.github_releases.checksums]
darwin_arm64 = "355bf612159eaa0c5375facd8f27536d9cb54e5af030328ea839a927a7901da5"
linux_amd64  = "3856ac7b6b2e33d6c8ab72a1036444156516e7303da85a9b13f661a2aa63bd2d"
linux_arm64  = "cb923d08703b966f7e0e6b1483ed4ba6ed77bc10812c5502bcc1fb6ee0f6ad59"

# The standalone Gateway and VM driver must use the same release.
[bin.openshell.microvm]
version = "0.1.9"

