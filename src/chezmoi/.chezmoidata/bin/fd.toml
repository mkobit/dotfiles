[bin.fd]
version = "10.5.2"

[bin.fd.github_releases]
repo            = "sharkdp/fd"
external_type   = "archive-file"
executable      = true
checksum_type   = "sha256"
tag_format      = "v{version}"
filename_format = "fd-v{version}-{target}.tar.gz"
path_format     = "fd-v{version}-{target}/fd"
url_format      = "{base}/{repo}/releases/download/{tag}/{filename}"

[bin.fd.github_releases.platforms]
darwin_arm64 = "aarch64-apple-darwin"
darwin_amd64 = "x86_64-apple-darwin"
linux_amd64  = "x86_64-unknown-linux-musl"
linux_arm64  = "aarch64-unknown-linux-musl"

[bin.fd.github_releases.checksums]
darwin_arm64 = "81bf98a16d3d7230e4a9123fcede243d71ea31a577113476ed43f1cdf4773162"
linux_amd64  = "7e2d07fa2b8807642aaec67b7e2972a9fbe4db26fcb340a7372392db42b26694"
linux_arm64  = "63ea52cb31586e6d98efa2f06d73d542f16c7d0c4af0f07b579aaf9714cf907a"
darwin_amd64 = "0f02e6000a8c896cd254cf4dccc7da1e604e77a32c6783609eed5e4cb07785e3"

[bin.fd.homebrew]
name = "fd"

# Debian/Ubuntu package is named fd-find; binary is fdfind (symlink fd manually)
[bin.fd.apt]
name = "fd-find"
