[bin.sbx]
version = "0.53.0"

[bin.sbx.homebrew]
name = "docker/tap/sbx"
cask = true

[bin.sbx.github_releases]
repo             = "docker/sbx-releases"
external_type    = "archive"
checksum_type    = "sha256"
tag_format       = "v{version}"
filename_format  = "DockerSandboxes-{target}.{ext}"
path_format      = "lib/docker-sbx"
url_format       = "{base}/{repo}/releases/download/{tag}/{filename}"
strip_components = 1

[bin.sbx.github_releases.platforms]
linux_amd64 = "linux-amd64"
linux_arm64 = "linux-arm64"

[bin.sbx.github_releases.ext]
linux_amd64 = "tar.gz"
linux_arm64 = "tar.gz"

[bin.sbx.github_releases.checksums]
linux_amd64 = "a8e171ed331e2485ff8d46978d7bf9e74929769acacb6759c15a0a665a3b7bb2"
linux_arm64 = "615a8045fe4d9860d5d1bb30df0189e33b5e3deb22aef820b2947d4b0697438b"
