[bin.btop]
version = "1.4.8"

# btop does not publish macOS binaries — linux only
[bin.btop.github_releases]
repo            = "aristocratos/btop"
external_type   = "archive-file"
executable      = true
checksum_type   = "sha256"
tag_format      = "v{version}"
filename_format = "btop-{target}.tar.gz"
path_format     = "./btop/bin/btop"
url_format      = "{base}/{repo}/releases/download/{tag}/{filename}"

[bin.btop.github_releases.platforms]
linux_amd64 = "x86_64-unknown-linux-musl"
linux_arm64 = "aarch64-unknown-linux-musl"

[bin.btop.github_releases.checksums]
linux_amd64 = "af589cf82cc9ea9c29ce050b9239a13bef2d1492256d476156e1054a42ce89ad"
linux_arm64 = "95328e26ab08f42033af26628e2d169206a5a420f35669ce17459ef85114c14c"

[bin.btop.homebrew]
name = "btop"
