[bin.claude]
version = "2.1.286"
minimum_release_age = "7d"

[bin.claude.updater]
source = "claude"
repo = "anthropics/claude-code"
manifest_url_format = "https://downloads.claude.ai/claude-code-releases/{version}/manifest.json"

# Native releases: https://code.claude.com/docs/en/setup
[bin.claude.direct_release]
external_type = "file"
executable = true
checksum_type = "sha256"
url_format = "https://downloads.claude.ai/claude-code-releases/{version}/{target}/claude"

[bin.claude.direct_release.platforms]
darwin_arm64 = "darwin-arm64"
darwin_amd64 = "darwin-x64"
linux_arm64 = "linux-arm64"
linux_amd64 = "linux-x64"

