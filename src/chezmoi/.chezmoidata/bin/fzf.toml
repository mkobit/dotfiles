[bin.fzf]
version = "0.74.5"

# fzf filename uses {os}_{arch} directly — not a target triple
[bin.fzf.github_releases]
repo            = "junegunn/fzf"
external_type   = "archive-file"
executable      = true
checksum_type   = "sha256"
tag_format      = "v{version}"
filename_format = "fzf-{version}-{os}_{arch}.tar.gz"
path_format     = "fzf"
url_format      = "{base}/{repo}/releases/download/{tag}/{filename}"

# platforms map gates supported platforms; values unused (filename uses {os}_{arch})
[bin.fzf.github_releases.platforms]
darwin_arm64 = ""
darwin_amd64 = ""
linux_amd64  = ""
linux_arm64  = ""

[bin.fzf.github_releases.checksums]
darwin_arm64 = "ada808c7401b9949ce8842274ac16a6b6193fd32dcada396884a6a9a89e5985a"
darwin_amd64 = "aca6cab692e6c069e724a43070a448e18586c7c0fdd1139f6d487ec1680599ed"
linux_amd64  = "d47d7f882972c7d674dbbba998ffa4116e68379616ffac7695d0671e9a722c5f"
linux_arm64  = "cf058001da21724a469b714a29cf4aab9cbe860d218a0d6c1b5b661efad7784c"

[bin.fzf.homebrew]
name = "fzf"

[bin.fzf.apt]
name = "fzf"
