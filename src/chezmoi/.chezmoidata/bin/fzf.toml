[bin.fzf]
version = "0.74.2"

# fzf filename uses {os}_{arch} directly — not a target triple
[bin.fzf.github_releases]
repo            = "junegunn/fzf"
external_type   = "archive-file"
executable      = true
checksum_type   = "sha256"
tag_format      = "v{version}"
filename_format = "fzf-{version}-{os}_{arch}.tar.gz"
path_format     = "fzf"
url_format      = "{base}/{repo}/releases/download/{tag}/{filename}"

# platforms map gates supported platforms; values unused (filename uses {os}_{arch})
[bin.fzf.github_releases.platforms]
darwin_arm64 = ""
darwin_amd64 = ""
linux_amd64  = ""
linux_arm64  = ""

[bin.fzf.github_releases.checksums]
darwin_arm64 = "d60ddb36356566ac69bae7c3504e888916cf747c9ad2132141c09229b1e28dee"
darwin_amd64 = "b019ae8bcca33945a2ffbbbf8369705405cd1406fc4d74267e712797010e3676"
linux_amd64  = "b3648f48675612b69ee35371cf6dc99ca96d767e89b912d079080916ac8ba8bd"
linux_arm64  = "1373e3f5ed3c468179d4529942ddd96c234bcad1bcacaf238916e26a5234b5b2"

[bin.fzf.homebrew]
name = "fzf"

[bin.fzf.apt]
name = "fzf"
