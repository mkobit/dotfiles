[bin.agy]
version = "1.5.3"

[bin.agy.github_releases]
repo            = "google-antigravity/antigravity-cli"
bin_name        = "agy"
external_type   = "archive-file"
executable      = true
checksum_type   = "sha256"
tag_format      = "{version}"
filename_format = "agy_cli_{target}.tar.gz"
path_format     = "antigravity"
url_format      = "{base}/{repo}/releases/download/{tag}/{filename}"

[bin.agy.github_releases.platforms]
darwin_arm64 = "mac_arm64"
darwin_amd64 = "mac_x64"
linux_amd64  = "linux_x64"
linux_arm64  = "linux_arm64"

