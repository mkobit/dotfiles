[bin.gh-stack]
version = "0.3.0"

[bin.gh-stack.github_releases]
repo            = "github/gh-stack"
bin_name        = "gh-stack/gh-stack"
external_type   = "file"
executable      = true
checksum_type   = "sha256"
tag_format      = "v{version}"
filename_format = "{target}"
url_format      = "{base}/{repo}/releases/download/{tag}/{filename}"

[bin.gh-stack.github_releases.platforms]
darwin_amd64 = "darwin-amd64"
darwin_arm64 = "darwin-arm64"
linux_amd64  = "linux-amd64"
linux_arm64  = "linux-arm64"

