[bin.gh-actions-lock]
version = "0.4.0"
minimum_release_age = "21d"

[bin.gh-actions-lock.github_releases]
repo            = "github/gh-actions-lock"
bin_name        = "gh-actions-lock/gh-actions-lock"
external_type   = "file"
executable      = true
checksum_type   = "sha256"
tag_format      = "v{version}"
filename_format = "{target}"
url_format      = "{base}/{repo}/releases/download/{tag}/{filename}"

[bin.gh-actions-lock.github_releases.platforms]
darwin_amd64 = "darwin-amd64"
darwin_arm64 = "darwin-arm64"
linux_amd64  = "linux-amd64"
linux_arm64  = "linux-arm64"

