# Static chezmoi configuration for building the standalone /sandbox OCI layer.
# The Dockerfile uses this file with the /sandbox destination.
# Never runs interactive chezmoi init probes or host-only OS package managers.

[scriptEnv]
MISE_CONFIG_DIR = "/sandbox/.config/mise"
MISE_DATA_DIR   = "/sandbox/.local/share/mise"
MISE_STATE_DIR  = "/sandbox/.local/state/mise"

[data.zsh]
set_as_default_login_shell = false

[data.ai.plugins.superpowers]
installation_method = "chezmoi_external"

[data.ai.plugins.egm]
installation_method = "chezmoi_external"

[data.ai.plugin_bridge]
default_hosts = ["claude", "codex"]

[data.claude_code]
installation_method = "direct_release"

[data.codex.telemetry]
enabled = false
log_user_prompt = false

[data.gemini.general]
enable_auto_update = false

[data.git.personal]
enabled = true

[data.git_hooks]
backend = "config"

[data.git_hooks.pre_commit]
installation_method = "none"

[data.local.bin.agy]
installation_method = "github_releases"
auto_update = false

[data.local.bin.bat]
installation_method = "github_releases"

[data.local.bin.betterleaks]
installation_method = "none"

[data.local.bin.bkt]
