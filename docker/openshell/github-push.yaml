# Narrow policy for an explicit signed-bundle push to mkobit/dotfiles.
version: 1

filesystem_policy:
  read_only:
    - /bin
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
    - /var/log
    - /sandbox
  read_write:
    - /tmp
    - /dev/null

landlock:
  compatibility: hard_requirement

network_policies:
  dotfiles_push:
    name: dotfiles-push
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: "/mkobit/dotfiles.git/info/refs*"}
          - allow: {method: POST, path: "/mkobit/dotfiles.git/git-upload-pack"}
          - allow: {method: POST, path: "/mkobit/dotfiles.git/git-receive-pack"}
    binaries:
      - path: /usr/bin/git
